[package]
name = "rsui-android"
description = "An rsui app on Android: the library an APK starts, which runs the app it carries in its assets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]
# The library's file is librsui_app.so, which the APK's manifest names.
name = "rsui_app"

[target.'cfg(target_os = "android")'.dependencies]
rsui = { path = "../rsui" }
rsui-tsx = { path = "../rsui-tsx" }
rsui-js = { path = "../rsui-js" }
