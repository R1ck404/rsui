name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check every crate, test and example
        run: cargo check --workspace --all-targets --locked
      - name: Build the rsui-tsx program
        run: cargo build --release -p rsui-tsx --locked
